# Alternative to install.sh:
#   cp pve-lab-chat.env.example .env   # edit BACKEND_URL etc.
#   docker compose up -d
services:
  pve-lab-chat:
    image: python:3.12-alpine
    container_name: pve-lab-chat
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "server.py"]
    volumes:
      - ./server.py:/app/server.py:ro
      - ./static:/app/static:ro
    env_file: .env
    # host networking so the container can reach a model server bound to 127.0.0.1
    network_mode: host
